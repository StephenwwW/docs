<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>相片/座標轉 Google Maps</title>
    <script src="https://cdn.jsdelivr.net/npm/exif-js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            max-width: 600px;
            margin: 2rem auto;
            padding: 0 1rem;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #4285F4; }
        .section {
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #eee;
        }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }
        button {
            background-color: #4285F4;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover { background-color: #3367D6; }
        #resultArea {
            display: none;
            background-color: #e8f0fe;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .link-box {
            word-break: break-all;
            margin-bottom: 15px;
        }
        .link-box a {
            color: #d93025;
            font-weight: bold;
            text-decoration: none;
            font-size: 1.2rem;
        }
        iframe {
            width: 100%;
            height: 300px;
            border: 0;
            border-radius: 8px;
        }
        .error { color: red; margin-top: 5px; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>📍 相片 & 座標定位工具</h2>

    <div class="section">
        <h3>方法 1：上傳相片 (讀取 EXIF)</h3>
        <p style="font-size:0.9rem; color:#666;">注意：相片必須包含 GPS 資訊 (如手機拍攝的原圖)。社群軟體(LINE/FB)下載的圖通常會遺失座標。</p>
        <input type="file" id="fileInput" accept="image/jpeg, image/jpg">
        <div id="photoError" class="error"></div>
    </div>

    <div class="section" style="border-bottom: none;">
        <h3>方法 2：手動輸入座標</h3>
        <div style="display: flex; gap: 10px;">
            <div style="flex:1;">
                <label>緯度 (Latitude)</label>
                <input type="number" id="manualLat" placeholder="例如: 25.0339">
            </div>
            <div style="flex:1;">
                <label>經度 (Longitude)</label>
                <input type="number" id="manualLng" placeholder="例如: 121.5644">
            </div>
        </div>
        <button onclick="handleManualInput()">產生並前往地圖</button>
    </div>

    <div id="resultArea">
        <div class="link-box">
            <strong>Google Maps 連結：</strong><br>
            <a id="mapLink" href="#" target="_blank">點擊這裡開啟地圖</a>
        </div>
        <iframe id="mapFrame" src="" allowfullscreen></iframe>
    </div>
</div>

<script>
    // 監聽檔案上傳
    document.getElementById("fileInput").addEventListener('change', handleFileSelect, false);

    function handleFileSelect(evt) {
        const file = evt.target.files[0];
        const errorDiv = document.getElementById("photoError");
        errorDiv.textContent = ""; // 清空錯誤訊息
        
        if (!file) return;

        // 使用 EXIF.js 讀取資料
        EXIF.getData(file, function() {
            const lat = EXIF.getTag(this, "GPSLatitude");
            const lon = EXIF.getTag(this, "GPSLongitude");
            const latRef = EXIF.getTag(this, "GPSLatitudeRef"); // N or S
            const lonRef = EXIF.getTag(this, "GPSLongitudeRef"); // E or W

            if (lat && lon && latRef && lonRef) {
                // 將度分秒轉換為十進位
                const decimalLat = convertDMSToDD(lat[0], lat[1], lat[2], latRef);
                const decimalLon = convertDMSToDD(lon[0], lon[1], lon[2], lonRef);

                // 自動填入輸入框方便查看
                document.getElementById('manualLat').value = decimalLat.toFixed(6);
                document.getElementById('manualLng').value = decimalLon.toFixed(6);

                // 顯示結果
                showResult(decimalLat, decimalLon);
            } else {
                errorDiv.textContent = "❌ 錯誤：這張照片中找不到 GPS 資訊。請確認拍攝時有開啟定位，且不是從 LINE/Facebook 下載的壓縮圖。";
                document.getElementById('resultArea').style.display = 'none';
            }
        });
    }

    // 處理手動輸入
    function handleManualInput() {
        const lat = parseFloat(document.getElementById('manualLat').value);
        const lng = parseFloat(document.getElementById('manualLng').value);

        if (isNaN(lat) || isNaN(lng)) {
            alert("請輸入有效的數字座標！");
            return;
        }
        showResult(lat, lng);
    }

    // 顯示結果與地圖
    function showResult(lat, lng) {
        const resultArea = document.getElementById('resultArea');
        const mapLink = document.getElementById('mapLink');
        const mapFrame = document.getElementById('mapFrame');

        // Google Maps URL 格式
        const url = `https://www.google.com/maps?q=${lat},${lng}`;
        // 嵌入地圖 URL 格式
        const embedUrl = `https://maps.google.com/maps?q=${lat},${lng}&z=15&output=embed`;

        mapLink.href = url;
        mapLink.textContent = `📍 前往：${lat.toFixed(5)}, ${lng.toFixed(5)}`;
        mapFrame.src = embedUrl;
        
        resultArea.style.display = 'block';
    }

    // 核心數學公式：度分秒 (DMS) 轉 十進位 (DD)
    function convertDMSToDD(degrees, minutes, seconds, direction) {
        let dd = degrees + minutes / 60 + seconds / 3600;

        // 如果是南緯(S)或西經(W)，數值必須是負的
        if (direction === "S" || direction === "W") {
            dd = dd * -1;
        } 
        return dd;
    }
</script>

</body>
</html>
