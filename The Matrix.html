<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>駭客任務 - 動態閃躲特效</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0f0;
            text-shadow: 0 0 5px #0f0;
            pointer-events: none;
            z-index: 10;
        }
        h1 {
            font-size: 24px;
            margin: 0 0 10px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        p {
            font-size: 14px;
            opacity: 0.8;
        }
        .matrix-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0, 20, 0, 0.2) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
            z-index: 5;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <h1>THE MATRIX EFFECT</h1>
        <p>狀態: 動態閃躲系統啟動</p>
        <p>威脅偵測: <span id="proximity-meter">掃描中...</span></p>
    </div>
    
    <div class="matrix-overlay"></div>
    <div id="canvas-container"></div>

    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 變數與設置 ---
        let scene, camera, renderer;
        let characterGroup, upperBodyGroup; // 新增 upperBodyGroup 全域變數以便控制
        let bullets = [];
        let clock;
        let timeScale = 1.0; 
        
        // 動作控制變數
        let currentLeanZ = 0; // 左右側身角度
        let currentLeanX = -Math.PI / 2.2; // 前後下腰角度
        
        // 駭客任務綠色主題
        const NEON_GREEN = 0x00ff41;
        const DARK_GREEN = 0x003300;
        const BULLET_COLOR = 0xffd700;

        function init() {
            // 1. 場景設置
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050505);
            scene.fog = new THREE.FogExp2(0x000000, 0.03);

            // 2. 攝影機設置
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(5, 2, 5);

            // 3. 渲染器設置
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            clock = new THREE.Clock();

            // 4. 燈光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const spotLight = new THREE.SpotLight(0xffffff, 1);
            spotLight.position.set(5, 10, 5);
            spotLight.castShadow = true;
            spotLight.shadow.mapSize.width = 1024;
            spotLight.shadow.mapSize.height = 1024;
            scene.add(spotLight);

            const floorLight = new THREE.PointLight(NEON_GREEN, 0.8, 20);
            floorLight.position.set(0, -2, 0);
            scene.add(floorLight);

            // 5. 地板
            const gridHelper = new THREE.GridHelper(50, 50, NEON_GREEN, DARK_GREEN);
            scene.add(gridHelper);

            // 6. 創建主角
            createCharacter();

            // 7. 發射子彈 (稍微加快頻率，讓閃躲更頻繁)
            setInterval(spawnBullet, 2000);
            spawnBullet();

            window.addEventListener('resize', onWindowResize, false);
            animate();
        }

        function createCharacter() {
            characterGroup = new THREE.Group();

            const skinMaterial = new THREE.MeshStandardMaterial({ color: 0xffccaa, roughness: 0.5 });
            const suitMaterial = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.7 });
            const glassesMaterial = new THREE.MeshPhongMaterial({ color: 0x000000, shininess: 100 });

            // 下半身
            const leftLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.2, 16), suitMaterial);
            leftLeg.position.set(-0.3, 0.6, 0);
            leftLeg.castShadow = true;
            characterGroup.add(leftLeg);

            const rightLeg = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 1.2, 16), suitMaterial);
            rightLeg.position.set(0.3, 0.6, 0.3);
            rightLeg.castShadow = true;
            characterGroup.add(rightLeg);

            // 骨盆
            const hips = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.3, 0.4), suitMaterial);
            hips.position.set(0, 1.2, 0.15);
            hips.castShadow = true;
            characterGroup.add(hips);

            // --- 上半身群組 (全域變數) ---
            upperBodyGroup = new THREE.Group();
            upperBodyGroup.position.set(0, 1.3, 0.15); 
            characterGroup.add(upperBodyGroup);

            // 軀幹
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.4, 0.3), suitMaterial);
            torso.position.set(0, 0.7, 0); 
            torso.castShadow = true;
            upperBodyGroup.add(torso);

            // 頭部
            const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), skinMaterial);
            head.position.set(0, 1.6, 0.1);
            head.castShadow = true;
            upperBodyGroup.add(head);

            // 墨鏡
            const glasses = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.08, 0.1), glassesMaterial);
            glasses.position.set(0, 1.62, 0.32);
            upperBodyGroup.add(glasses);

            // 手臂
            const leftArmGroup = new THREE.Group();
            leftArmGroup.position.set(-0.35, 1.2, 0);
            upperBodyGroup.add(leftArmGroup);
            
            const leftArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 16), suitMaterial);
            leftArm.position.set(0, -0.6, 0);
            leftArm.rotation.z = Math.PI / 4;
            leftArm.castShadow = true;
            leftArmGroup.add(leftArm);

            const rightArmGroup = new THREE.Group();
            rightArmGroup.position.set(0.35, 1.2, 0);
            upperBodyGroup.add(rightArmGroup);

            const rightArm = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 16), suitMaterial);
            rightArm.position.set(0, -0.6, 0);
            rightArm.rotation.z = -Math.PI / 4;
            rightArm.castShadow = true;
            rightArmGroup.add(rightArm);

            // 初始姿勢
            upperBodyGroup.rotation.x = currentLeanX;
            characterGroup.position.y = -0.2;

            scene.add(characterGroup);
        }

        function spawnBullet() {
            const count = Math.floor(Math.random() * 2) + 2; // 2-3 顆
            
            for(let i=0; i<count; i++) {
                const bulletGroup = new THREE.Group();

                // 子彈
                const geometry = new THREE.CylinderGeometry(0.05, 0.05, 0.4, 16);
                geometry.rotateX(Math.PI / 2);
                const material = new THREE.MeshStandardMaterial({ 
                    color: BULLET_COLOR, 
                    metalness: 1.0, 
                    roughness: 0.3,
                    emissive: 0xaa4400,
                    emissiveIntensity: 0.2
                });
                const bulletMesh = new THREE.Mesh(geometry, material);
                bulletGroup.add(bulletMesh);

                // 軌跡
                const trailGeo = new THREE.CylinderGeometry(0.1, 0.02, 2.0, 16, 1, true);
                trailGeo.rotateX(Math.PI / 2);
                trailGeo.translate(0, 0, 1.1);
                const trailMat = new THREE.MeshBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 0.1,
                    side: THREE.DoubleSide,
                    blending: THREE.AdditiveBlending
                });
                const trail = new THREE.Mesh(trailGeo, trailMat);
                bulletGroup.add(trail);

                // 隨機位置 - 調整為更有威脅性的範圍
                const startZ = 15 + (Math.random() * 5); 
                // X軸範圍縮小，讓子彈更靠近主角，迫使閃躲
                const startX = (Math.random() - 0.5) * 1.5; 
                // Y軸高度
                const startY = 1.0 + Math.random() * 0.6;

                bulletGroup.position.set(startX, startY, startZ);
                
                const speed = 8.0 + Math.random() * 4.0;

                scene.add(bulletGroup);

                bullets.push({
                    mesh: bulletGroup,
                    speed: speed,
                    trail: trail
                });
            }
        }

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const now = Date.now();
            
            // --- 1. 計算最近威脅與閃躲邏輯 ---
            let minDistance = 999;
            let closestBullet = null;

            bullets.forEach(b => {
                // 計算與主角上半身的距離
                const dist = b.mesh.position.distanceTo(new THREE.Vector3(0, 1.3, 0));
                
                // 找出前方且最近的子彈
                if (dist < minDistance) {
                    minDistance = dist;
                    closestBullet = b;
                }
            });

            // 基礎閒置動作 (呼吸般的微幅擺動)
            let targetZ = Math.sin(now * 0.002) * 0.1; 
            let targetX = -Math.PI / 2.2; // 基礎下腰角度

            // 如果有威脅接近
            if (minDistance < 6.0 && closestBullet) {
                // 子彈時間邏輯
                let slowFactor = 0.05 + (minDistance / 6.0) * 0.95;
                // 限制最慢速度
                if (slowFactor < 0.02) slowFactor = 0.02;
                
                // 平滑過渡時間流速
                timeScale += (slowFactor - timeScale) * 0.1;

                // UI 更新
                document.getElementById('proximity-meter').innerText = Math.floor((6.0 - minDistance) / 6.0 * 100) + "%";
                document.getElementById('proximity-meter').style.color = "#ff3333";

                // --- 閃躲邏輯 ---
                const bx = closestBullet.mesh.position.x;
                const bz = closestBullet.mesh.position.z;

                // 只有當子彈真的在前方時才閃躲 (z > -1)
                if (bz > -1) {
                    // 根據子彈 X 軸位置決定閃躲方向
                    // 如果子彈在右邊 (bx > 0)，身體往左傾 (RotZ > 0)
                    // 如果子彈在左邊 (bx < 0)，身體往右傾 (RotZ < 0)
                    // 係數 0.8 是最大傾斜角度
                    let dodgeIntensity = (6.0 - minDistance) / 6.0; // 越近閃越大
                    
                    if (bx > 0.1) {
                        targetZ = 0.6 * dodgeIntensity; // 往左閃
                    } else if (bx < -0.1) {
                        targetZ = -0.6 * dodgeIntensity; // 往右閃
                    } else {
                        // 子彈在正中間！隨機選一邊或維持之前方向
                        targetZ = (Math.sin(now) > 0 ? 0.6 : -0.6) * dodgeIntensity;
                    }

                    // 危急時刻壓得更低
                    targetX = -Math.PI / 2.2 - (0.3 * dodgeIntensity);
                }

            } else {
                // 無威脅，恢復正常時間
                timeScale += (1.0 - timeScale) * 0.05;
                document.getElementById('proximity-meter').innerText = "安全";
                document.getElementById('proximity-meter').style.color = "#0f0";
            }

            // 平滑插值更新姿勢 (Lerp)
            currentLeanZ += (targetZ - currentLeanZ) * 0.1;
            currentLeanX += (targetX - currentLeanX) * 0.1;

            if (upperBodyGroup) {
                upperBodyGroup.rotation.z = currentLeanZ;
                upperBodyGroup.rotation.x = currentLeanX;
            }

            // --- 2. 更新子彈位置 ---
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.mesh.position.z -= b.speed * timeScale * delta;
                b.mesh.rotation.z += 10 * timeScale * delta;

                if (b.trail) {
                    b.trail.material.opacity = 0.1 + Math.random() * 0.1;
                    b.trail.scale.setScalar(1 + Math.sin(now * 0.02) * 0.2);
                }

                if (b.mesh.position.z < -10) {
                    scene.remove(b.mesh);
                    bullets.splice(i, 1);
                }
            }

            // --- 3. 攝影機運鏡 ---
            const camTime = now * 0.0005;
            const radius = 6;
            // 攝影機稍微上下浮動，增加臨場感
            camera.position.x = Math.sin(camTime) * radius;
            camera.position.z = Math.cos(camTime) * radius;
            camera.position.y = 2 + Math.sin(camTime * 0.5) * 0.5;
            camera.lookAt(0, 0.5, 0);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();

    </script>
</body>
</html>
